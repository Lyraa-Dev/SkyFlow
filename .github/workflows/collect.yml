name: Coleta de tráfego aéreo (bronze)

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta-bronze
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar snapshot e gravar bronze
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: python src/collect.py

      - name: Commitar os novos dados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bronze
          # Só commita se houver algo novo (evita commit vazio quebrando o job).
          if git diff --staged --quiet; then
            echo "Nenhum dado novo para commitar."
          else
            git commit -m "chore(bronze): coleta automática $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
